<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filter for crisp clean Neobrutalism drop shadow -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="100" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" fill="#F6F4EE"/>

  <!-- Neobrutalism Hard Shadow -->
  <rect x="96" y="96" width="336" height="336" rx="64" fill="#000000"/>

  <!-- Main Neobrutalism Card (Deep Indigo #312E81) -->
  <rect x="80" y="80" width="336" height="336" rx="64" fill="#312E81" stroke="#000000" stroke-width="16"/>

  <!-- Subtle Inner Accent / Sparkle badge in top-right -->
  <g transform="translate(345, 115)">
    <!-- Shadow for decorative pill/sparkle -->
    <circle cx="2" cy="2" r="18" fill="#000000"/>
    <circle cx="0" cy="0" r="18" fill="#FFE500" stroke="#000000" stroke-width="5"/>
  </g>

  <!-- Big Bold Checkmark Icon -->
  <polyline points="160,250 225,315 338,190" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
